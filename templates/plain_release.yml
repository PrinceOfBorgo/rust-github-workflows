# Minimal `determine-release-type → bump → finalize → create → open-next-snapshot → rollback-release (on failure)`
# pipeline for projects that don't ship extra build artifacts. The release type
# is inferred from the head commit message.

name: Release

on:
  push:
    branches: [ main ]

jobs:
  release:
    uses: PrinceOfBorgo/rust-github-workflows/.github/workflows/release.yml@v2
    ### For a workspace, uncomment and pass the per-crate paths below
    # with:
    #   cargo_toml_path: crates/my-crate/Cargo.toml
    #   changelog_path: crates/my-crate/CHANGELOG.md
    permissions:
      contents: write
