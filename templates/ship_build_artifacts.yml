# This workflow is designed to handle releases for a Rust project that ships
# compiled binaries (or other built assets) attached to the GitHub release.
#
# Customize `build` step to build your specific Rust crate and adjust the
# artifact path as needed.
#
# The example below uses an inline build job; if the only thing your build does
# is compile a `--bin` and zip/tar.gz the result, prefer the dedicated 
# `build-package-binary.yml` granular workflow (or, for the full pipeline, see
# `ship_binary_archives.yml`).

name: Release

on:
  push:
    branches: [ main ]

jobs:
  determine_type:
    uses: PrinceOfBorgo/rust-github-workflows/.github/workflows/determine-release-type.yml@v2

  bump_version:
    needs: determine_type
    uses: PrinceOfBorgo/rust-github-workflows/.github/workflows/bump-version.yml@v2
    with:
      release_type: ${{ needs.determine_type.outputs.release_type }}
    permissions:
      contents: write

  build:
    needs: bump_version
    runs-on: ubuntu-latest
    outputs:
      artifact_path: ${{ steps.build.outputs.artifact }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        id: build
        run: |
          cargo build --release
          mkdir -p dist
          cp target/release/my-app dist/my-app-${{ needs.bump_version.outputs.new_version }}
          echo "artifact=dist/my-app-${{ needs.bump_version.outputs.new_version }}" >> "$GITHUB_OUTPUT"
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-build
          path: dist/
          retention-days: 1

  finalize:
    needs: [bump_version, build]
    uses: PrinceOfBorgo/rust-github-workflows/.github/workflows/finalize-release.yml@v2
    with:
      version: ${{ needs.bump_version.outputs.new_version }}
    permissions:
      contents: write

  create_release:
    needs: [finalize, bump_version, build]
    uses: PrinceOfBorgo/rust-github-workflows/.github/workflows/create-release.yml@v2
    with:
      version: ${{ needs.bump_version.outputs.new_version }}
      changelog_section_heading: ${{ needs.bump_version.outputs.changelog_section_heading }}
      release_assets: ${{ format('["{0}"]', needs.build.outputs.artifact_path) }}
    permissions:
      contents: write

  open_next:
    needs: [finalize, create_release]
    uses: PrinceOfBorgo/rust-github-workflows/.github/workflows/open-next-snapshot.yml@v2
    permissions:
      contents: write
